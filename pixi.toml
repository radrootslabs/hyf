[workspace]
name = "hyf"
version = "0.1.0"
description = "Contextual intelligence for the Radroots network"
authors = ["Radroots Authors"]
channels = [
  "https://conda.modular.com/max-nightly/",
  "conda-forge",
  "https://prefix.dev/modular-community",
]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[dependencies]
mojo = "==1.0.0b1"
json = { git = "https://github.com/triesap/mojo_json.git", rev = "56025d73631054d7803143fa5e68c5de578e33f5" }
morph = { git = "https://github.com/triesap/mojo_morph.git", rev = "ea73f909990f3d3f5d12b786fec2f09e1e09f462" }
flare = { git = "https://github.com/triesap/mojo_flare.git", rev = "14aa338d8c4f352ebb2d590cddfde0bde5ea1971" }

[tasks]
run = "mojo run -I src src/main.mojo"
test-unit = "mojo -I src tests/test_hyf.mojo"
test-runtime = "mojo -I src tests/test_runtime_paths.mojo"
test-repo-local-process = "mojo -I src tests/test_repo_local_process_contract.mojo"
test-stdio = "mojo -I src tests/test_stdio_contract.mojo"
test-provider-adapter = "mojo -I src -I tests tests/test_provider_adapter.mojo"
test-domain = "mojo -I src -I tests tests/test_domain.mojo"
test-assist = "mojo -I src -I tests tests/test_assist.mojo"
test-jev = "mojo -I src -I tests tests/test_jev.mojo"
test-application = "mojo -I src -I tests tests/test_application.mojo"
test-stdio-session = "mojo -I src -I tests tests/test_persistent_stdio.mojo"
test-journeys = "mojo -I src -I tests tests/test_journeys.mojo"
test-soak = "mojo -I src -I tests tests/test_soak.mojo"
test-spec = "mojo -I src -I tests tests/test_traceability.mojo"
check-build = "mkdir -p .pixi/build && mojo build -I src src/main.mojo -o .pixi/build/hyfd"
check-format = "sh tools/check_format.sh"
check-release = { depends-on = [
  "test",
  "check-build",
] }
test-architecture = "sh tools/check_architecture.sh --self-test"
smoke-max-local = "mojo -I src -I tests tests/max_local_operator_smoke.mojo"
smoke-jev = "mojo -I src -I tests tests/smoke_jev.mojo"
eval-jev = "mojo -I src -I tests tests/eval_jev.mojo"
test-runtime-contract = { depends-on = [
  "test-runtime",
  "test-repo-local-process",
  "test-stdio",
] }
test = { depends-on = [
  "test-unit",
  "test-domain",
  "test-assist",
  "test-jev",
  "test-application",
  "test-stdio-session",
  "test-journeys",
  "test-provider-adapter",
  "test-spec",
  "test-architecture",
  "test-runtime-contract",
] }
